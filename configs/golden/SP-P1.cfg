hostname SP-P1
!
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.2 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_SP_PE1
 ip address 172.16.0.6 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_SP_PE3
 ip address 172.16.0.17 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description LINK_TO_SP_PE2
 ip address 172.16.0.9 255.255.255.252
 mpls ip
 no shutdown
!
router ospf 100
 router-id 172.16.255.2
 network 172.16.0.4 0.0.0.3 area 0
 network 172.16.0.8 0.0.0.3 area 0
 network 172.16.0.16 0.0.0.3 area 0
 network 172.16.255.2 0.0.0.0 area 0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
