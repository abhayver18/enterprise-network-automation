! ==============================================================================
! DEVICE: SP-P1 | SERVICE PROVIDER CORE (P) ROUTER
! ==============================================================================
! --- SYSTEM & MANAGEMENT --
hostname SP-P1
ip domain name lab.local
service timestamps debug datetime msec
service timestamps log datetime msec
login on-success log
! --- AAA & LOCAL ACCESS --
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa session-id common
username automation privilege 15 secret 9 $9$CM/.zrTZwRl/F.$ycpovSkOIQ7.VrnAcxNmc3RvBnUwtWsQ2ZODqivYKrg
! --- SWITCHING & GLOBAL FORWARDING --
ip cef
no ipv6 cef
spanning-tree mode rapid-pvst
ip ssh bulk-mode 131072
ip http server
ip http secure-server
no logging btrace
! --- MPLS GLOBAL SETTINGS --
mpls label protocol ldp
mpls ldp router-id Loopback0 force
! --- INTERFACES --
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.2 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_SP_PE1
 ip address 172.16.0.6 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_SP_PE3
 ip address 172.16.0.17 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description LINK_TO_SP_PE2
 ip address 172.16.0.9 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/3
 description UNUSED_PORT
 no ip address
 shutdown
! --- IGP ROUTING (OSPF) --
router ospf 100
 router-id 172.16.255.2
 network 172.16.0.4 0.0.0.3 area 0
 network 172.16.0.8 0.0.0.3 area 0
 network 172.16.0.16 0.0.0.3 area 0
 network 172.16.255.2 0.0.0.0 area 0
! --- STATIC ROUTES --
ip route 10.10.30.0 255.255.255.0 172.16.0.5
ip route 172.16.0.12 255.255.255.252 172.16.0.10
ip route 172.16.0.20 255.255.255.252 172.16.0.18
! --- LINE ACCESS & MANAGEMENT --
line con 0
 logging synchronous
line aux 0
line vty 0 4
 transport input ssh
end
