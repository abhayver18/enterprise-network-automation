! ==============================================================================
! DEVICE: SP-PE2 | SERVICE PROVIDER PE ROUTER
! ==============================================================================
! --- SYSTEM & MANAGEMENT --
hostname SP-PE2
ip domain name lab.local
service timestamps debug datetime msec
service timestamps log datetime msec
login on-success log
! --- AAA & LOCAL ACCESS --
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa session-id common
username automation privilege 15 secret 9 $9$9eA2PbZfXms1Ek$Qg77sdY3IPv0PtJFXvqOHC53pohRIBetCPJ5R1aZ64g
! --- VRF DEFINITIONS --
vrf definition ENTERPRISE
 description CUSTOMER_HYD_BRANCH
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
!
vrf definition MGMT
 description OUT_OF_BAND_MANAGEMENT
 !
 address-family ipv4
 exit-address-family
! --- SWITCHING & GLOBAL FORWARDING --
ip cef
no ipv6 cef
spanning-tree mode rapid-pvst
ip ssh bulk-mode 131072
ip http server
ip http secure-server
no logging btrace
! --- MPLS GLOBAL SETTINGS --
mpls label protocol ldp
mpls ldp router-id Loopback0 force
! --- INTERFACES --
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.3 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_SP_P1
 ip address 172.16.0.10 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/0.99
 description MANAGEMENT_VLAN_99
 encapsulation dot1Q 99
 vrf forwarding MGMT
 ip address 172.16.100.10 255.255.255.252
 no shutdown
!
interface Ethernet0/0.100
 description CUSTOMER_ENTERPRISE_VLAN_100
 encapsulation dot1Q 100
 vrf forwarding ENTERPRISE
 ip address 172.16.0.10 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_HYD_R1
 vrf forwarding ENTERPRISE
 ip address 172.16.0.13 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description UNUSED_PORT
 no ip address
 shutdown
!
interface Ethernet0/3
 description UNUSED_PORT
 no ip address
 shutdown
! --- IGP ROUTING (OSPF) --
router ospf 100
 router-id 172.16.255.3
 network 172.16.0.8 0.0.0.3 area 0
 network 172.16.255.3 0.0.0.0 area 0
! --- MP-BGP (VPNv4 & VRF ROUTING) --
router bgp 65000
 bgp router-id 172.16.255.3
 bgp log-neighbor-changes
 neighbor 172.16.255.1 remote-as 65000
 neighbor 172.16.255.1 update-source Loopback0
 neighbor 172.16.255.4 remote-as 65000
 neighbor 172.16.255.4 update-source Loopback0
 !
 address-family vpnv4
  neighbor 172.16.255.1 activate
  neighbor 172.16.255.1 send-community extended
  neighbor 172.16.255.4 activate
  neighbor 172.16.255.4 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf ENTERPRISE
  redistribute static
 exit-address-family
! --- STATIC ROUTES (GLOBAL & VRF) --
ip route 10.10.30.0 255.255.255.0 172.16.0.9
ip route 172.16.0.12 255.255.255.252 Ethernet0/1 172.16.0.14
ip route vrf ENTERPRISE 10.10.30.0 255.255.255.0 Ethernet0/0 172.16.0.9 global
ip route vrf ENTERPRISE 10.20.10.0 255.255.255.0 172.16.0.14
ip route vrf MGMT 0.0.0.0 0.0.0.0 172.16.100.9
ip route vrf MGMT 0.0.0.0 0.0.0.0 172.16.0.9
! --- LINE ACCESS & MANAGEMENT --
line con 0
 logging synchronous
line aux 0
line vty 0 4
 transport input ssh
! END OF SP-PE2
end
