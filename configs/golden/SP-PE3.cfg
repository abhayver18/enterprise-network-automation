! ==============================================================================
! DEVICE: SP-PE3 | SERVICE PROVIDER PE ROUTER
! ==============================================================================
! --- SYSTEM & MANAGEMENT --
hostname SP-PE3
ip domain name lab.local
service timestamps debug datetime msec
service timestamps log datetime msec
login on-success log
! --- AAA & LOCAL ACCESS --
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa session-id common
username automation privilege 15 secret 9 $9$b83bo2B5EJWuYE$oU0RkMA942ikbO49nLTIubOZvr44euJXBiYHhtY/Zlw
! --- VRF DEFINITIONS --
vrf definition ENTERPRISE
 description CUSTOMER_PUNE_BRANCH
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
! --- SWITCHING & GLOBAL FORWARDING --
ip cef
no ipv6 cef
spanning-tree mode rapid-pvst
ip ssh bulk-mode 131072
ip http server
ip http secure-server
no logging btrace
! --- MPLS GLOBAL SETTINGS --
mpls label protocol ldp
mpls ldp router-id Loopback0 force
! --- INTERFACES --
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.4 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_SP_P1
 ip address 172.16.0.18 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_PUNE_R1
 vrf forwarding ENTERPRISE
 ip address 172.16.0.21 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description UNUSED_PORT
 no ip address
 shutdown
!
interface Ethernet0/3
 description UNUSED_PORT
 no ip address
 shutdown
! --- IGP ROUTING (OSPF) --
router ospf 100
 router-id 172.16.255.4
 network 172.16.0.16 0.0.0.3 area 0
 network 172.16.255.4 0.0.0.0 area 0
! --- MP-BGP (VPNv4 & VRF ROUTING) --
router bgp 65000
 bgp router-id 172.16.255.4
 bgp log-neighbor-changes
 neighbor 172.16.255.1 remote-as 65000
 neighbor 172.16.255.1 update-source Loopback0
 neighbor 172.16.255.3 remote-as 65000
 neighbor 172.16.255.3 update-source Loopback0
 !
 address-family vpnv4
  neighbor 172.16.255.1 activate
  neighbor 172.16.255.1 send-community extended
  neighbor 172.16.255.3 activate
  neighbor 172.16.255.3 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf ENTERPRISE
  redistribute static
 exit-address-family
! --- STATIC ROUTES (GLOBAL & VRF) --
ip route 10.10.30.0 255.255.255.0 172.16.0.17
ip route 172.16.0.20 255.255.255.252 Ethernet0/1 172.16.0.22
ip route vrf ENTERPRISE 10.10.30.0 255.255.255.0 Ethernet0/0 172.16.0.17 global
ip route vrf ENTERPRISE 10.30.10.0 255.255.255.0 172.16.0.22
! --- LINE ACCESS & MANAGEMENT --
line con 0
 logging synchronous
line aux 0
line vty 0 4
 transport input ssh
end
