hostname HQ-CORE2
!
ip domain name lab.local
!
username automation privilege 15 secret cisco
!
crypto key generate rsa modulus 2048
!
ip ssh version 2
!
interface Loopback0
 description ENTERPRISE_CORE2_ROUTER_ID
 ip address 10.255.0.3 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_HQ_EDGE
 ip address 10.0.0.6 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_HQ_CORE1
 ip address 10.0.0.10 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description TRUNK_TO_HQ_SW2
 no ip address
 no shutdown
!
interface Ethernet0/2.10
 description USERS_GATEWAY
 encapsulation dot1Q 10
 ip address 10.10.10.2 255.255.255.0
 no shutdown
!
interface Ethernet0/2.20
 description SERVERS_GATEWAY
 encapsulation dot1Q 20
 ip address 10.10.20.2 255.255.255.0
 no shutdown
!
interface Ethernet0/2.30
 description NETWORK_MGMT_GATEWAY_BACKUP
 encapsulation dot1Q 30
 ip address 10.10.30.2 255.255.255.0
 no shutdown
!
interface Ethernet0/2.40
 description DEVOPS_GATEWAY
 encapsulation dot1Q 40
 ip address 10.10.40.2 255.255.255.0
 no shutdown
!
interface Ethernet0/2.50
 description GUEST_GATEWAY
 encapsulation dot1Q 50
 ip address 10.10.50.2 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.0.5
ip route 10.10.30.0 255.255.255.0 10.0.0.9
ip route 10.255.0.1 255.255.255.255 10.0.0.5
!
line vty 0 4
 login local
 transport input ssh
!
