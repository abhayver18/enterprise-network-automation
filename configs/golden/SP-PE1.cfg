! ==============================================================================
! DEVICE: SP-PE1 | SERVICE PROVIDER PE ROUTER
! ==============================================================================
! --- SYSTEM & MANAGEMENT --
hostname SP-PE1
ip domain name lab.local
service timestamps debug datetime msec
service timestamps log datetime msec
login on-success log
! --- AAA & LOCAL ACCESS --
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa session-id common
username automation privilege 15 secret 9 $9$734E.a5JihKRO.$U7zfI9sHsjRqrPn/f8yxVs7h5gEiUAPfdMDAbjywXv2
! --- VRF DEFINITIONS --
vrf definition ENTERPRISE
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
!
vrf definition MGMT
 description AUTOMATION_MGMT_VRF
 !
 address-family ipv4
 exit-address-family
! --- SWITCHING & GLOBAL FORWARDING --
ip cef
no ipv6 cef
spanning-tree mode rapid-pvst
ip ssh bulk-mode 131072
ip http server
ip http secure-server
no logging btrace
! --- MPLS GLOBAL SETTINGS --
mpls label protocol ldp
mpls ldp router-id Loopback0 force
! --- INTERFACES --
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.1 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description TRUNK_TO_ISP_R1
 no ip address
 no shutdown
!
interface Ethernet0/0.99
 description MGMT_VLAN_99
 encapsulation dot1Q 99
 vrf forwarding MGMT
 ip address 172.16.100.2 255.255.255.252
 no shutdown
!
interface Ethernet0/0.100
 description ENTERPRISE_VLAN_100
 encapsulation dot1Q 100
 vrf forwarding ENTERPRISE
 ip address 172.16.0.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_SP_P1
 ip address 172.16.0.5 255.255.255.252
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description UNUSED_PORT
 no ip address
 shutdown
!
interface Ethernet0/3
 description UNUSED_PORT
 no ip address
 shutdown
! --- IGP ROUTING (OSPF) --
router ospf 100
 router-id 172.16.255.1
 network 172.16.0.4 0.0.0.3 area 0
 network 172.16.255.1 0.0.0.0 area 0
! --- MP-BGP (VPNv4 & VRF ROUTING) --
router bgp 65000
 bgp router-id 172.16.255.1
 bgp log-neighbor-changes
 neighbor 172.16.255.3 remote-as 65000
 neighbor 172.16.255.3 update-source Loopback0
 neighbor 172.16.255.4 remote-as 65000
 neighbor 172.16.255.4 update-source Loopback0
 !
 address-family vpnv4
  neighbor 172.16.255.3 activate
  neighbor 172.16.255.3 send-community extended
  neighbor 172.16.255.4 activate
  neighbor 172.16.255.4 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf ENTERPRISE
  redistribute static
 exit-address-family
! --- STATIC ROUTES (GLOBAL & VRF) --
ip route 10.10.30.0 255.255.255.0 Ethernet0/0.99 172.16.100.1
ip route vrf ENTERPRISE 10.10.10.0 255.255.255.0 Ethernet0/0.100 172.16.0.1
ip route vrf MGMT 0.0.0.0 0.0.0.0 172.16.100.1
ip route vrf MGMT 172.16.0.0 255.255.0.0 Ethernet0/1 172.16.0.6 global
ip route vrf MGMT 172.16.0.6 255.255.255.255 172.16.0.6 global
! --- LINE ACCESS & MANAGEMENT --
line con 0
 logging synchronous
line aux 0
line vty 0 4
 transport input ssh
end
