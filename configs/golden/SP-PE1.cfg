hostname SP-PE1
!
vrf definition ENTERPRISE
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
!
interface Loopback0
 description ROUTER_ID
 ip address 172.16.255.1 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description LINK_TO_HQ_EDGE
 vrf forwarding ENTERPRISE
 ip address 172.16.0.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description LINK_TO_SP_P1
 ip address 172.16.0.5 255.255.255.252
 mpls ip
 no shutdown
!
router ospf 100
 router-id 172.16.255.1
 network 172.16.0.4 0.0.0.3 area 0
 network 172.16.255.1 0.0.0.0 area 0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
router bgp 65000
 bgp router-id 172.16.255.1
 neighbor 172.16.255.3 remote-as 65000
 neighbor 172.16.255.3 update-source Loopback0
 neighbor 172.16.255.4 remote-as 65000
 neighbor 172.16.255.4 update-source Loopback0
 !
 address-family vpnv4
  neighbor 172.16.255.3 activate
  neighbor 172.16.255.3 send-community extended
  neighbor 172.16.255.4 activate
  neighbor 172.16.255.4 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf ENTERPRISE
  redistribute static
 exit-address-family
!
ip route vrf ENTERPRISE 10.10.10.0 255.255.255.0 172.16.0.1
!
