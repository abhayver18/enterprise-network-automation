---
defaults:
  device_type: cisco_ios
  username: automation
  password: cisco123
  secret: cisco123
  global_delay_factor: 1
  fast_cli: false

devices:
  - hostname: SP-P1
    ip: 172.16.0.6
    host: 172.16.0.6
    group: core_p
    config_file: configs/golden/SP-P1.cfg
    role: core_transit

  - hostname: SP-PE1
    ip: 172.16.100.2
    host: 172.16.100.2
    group: provider_edge
    config_file: configs/golden/SP-PE1.cfg
    role: provider_edge

  - hostname: SP-PE2
    ip: 172.16.0.10
    host: 172.16.0.10
    group: provider_edge
    config_file: configs/golden/SP-PE2.cfg
    role: provider_edge

  - hostname: SP-PE3
    ip: 172.16.0.18
    host: 172.16.0.18
    group: provider_edge
    config_file: configs/golden/SP-PE3.cfg
    role: provider_edge

  - hostname: HYD-R1
    ip: 172.16.0.14
    host: 172.16.0.14
    group: customer_edge
    config_file: configs/golden/HYD-R1.cfg
    role: customer_edge

  - hostname: PUNE-R1
    ip: 172.16.0.22
    host: 172.16.0.22
    group: customer_edge
    config_file: configs/golden/PUNE-R1.cfg
    role: customer_edge
